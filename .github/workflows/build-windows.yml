name: Build Windows installer

# Builds the Python MT5 bridge and the Tauri app on a GitHub-hosted Windows
# machine (which ships MSVC + the Windows SDK), then publishes the NSIS
# installer as a downloadable artifact on the run's page.

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Build Python bridge (sidecar)
        working-directory: python-bridge
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --name python-server `
            --hidden-import MetaTrader5 --hidden-import flask_cors --hidden-import numpy `
            main.py
          New-Item -ItemType Directory -Force ..\src-tauri\bin | Out-Null
          Copy-Item -Force dist\python-server.exe ..\src-tauri\bin\python-server-x86_64-pc-windows-msvc.exe

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build app + installer
        run: npm run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: yetrade-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
